name: publish cail-eco

# Publishes @cuny-ai-lab/cail-eco to npm when a GitHub release tagged
# cail-eco-v<version> is published. Uses npm trusted publishing (OIDC), so no
# npm token is stored in this repository.
#
# A release publishes only the commit that is the current tip of `main`:
#   1. resolve: the tag must point at the released commit, match the package
#      version, and be the tip of main;
#   2. check: the full test workflow (Python tests, pip-audit, bun audit, lint,
#      typecheck, vitest) runs on that exact commit;
#   3. publish: one run at a time; after waiting for its turn and again right
#      before `npm publish`, the commit must still be the tip of main and the
#      tag must still point at it.
#
# Prerequisite: the package must already exist on npm before its trusted
# publisher can be configured. See "Publishing" in packages/cail-eco/README.md
# for the one-time bootstrap. Until it is done, consumers vendor a copy of
# packages/cail-eco/src.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve:
    # Other releases in this repository (the Python filter) and prereleases must not trigger an npm publish.
    if: ${{ startsWith(github.event.release.tag_name, 'cail-eco-v') && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Resolve the tagged commit and require it to be the tip of main
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "$sha" != "$RELEASED_SHA" ]; then
            echo "::error::$RELEASE_TAG now points at $sha, not the released commit $RELEASED_SHA"; exit 1
          fi
          version="$(jq -r .version packages/cail-eco/package.json)"
          if [ "$RELEASE_TAG" != "cail-eco-v$version" ]; then
            echo "::error::$RELEASE_TAG does not match package version $version"; exit 1
          fi
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$sha" != "$main" ]; then
            echo "::error::$RELEASE_TAG is $sha but the tip of main is $main"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      sha: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read

  publish:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    # Serialize publishing. A running publish is never cancelled. GitHub keeps
    # at most one run waiting per group, so a newer release that queues behind
    # it replaces an older waiting one, which ends as cancelled without
    # publishing (the main-tip check would reject the older commit anyway).
    concurrency:
      group: publish-cail-eco
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: packages/cail-eco
    steps:
      - name: Require the commit to still be the tip of main after waiting
        working-directory: .
        run: |
          set -euo pipefail
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG" --jq .sha)"
          if [ "$SHA" != "$main" ] || [ "$SHA" != "$tagged" ]; then
            echo "::error::checked $SHA, but main is now $main and $RELEASE_TAG is $tagged"; exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.20.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Pack, re-check main, and publish
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          tarball="$(npm pack | tail -n 1)"
          main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$SHA" != "$main" ]; then
            echo "::error::main moved to $main while publishing $SHA"; exit 1
          fi
          npm publish "$tarball" --access public
