name: publish cail-eco

# Publishes @cuny-ai-lab/cail-eco to npm when a GitHub release tagged
# cail-eco-v<version> is published. Uses npm trusted publishing (OIDC), so no
# npm token is stored in this repository.
#
# Prerequisite: an npm org owner must first configure trusted publishing for
# @cuny-ai-lab/cail-eco (repository CUNY-AI-Lab/eco-impact-openwebui, workflow
# publish-cail-eco.yml). Until then this workflow fails at `npm publish` and
# consumers vendor a copy of packages/cail-eco/src.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Other releases in this repository (the Python filter) and prereleases must not trigger an npm publish.
    if: ${{ startsWith(github.event.release.tag_name, 'cail-eco-v') && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cail-eco
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.20.0
      - name: Check the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "cail-eco-v$(jq -r .version package.json)"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --audit-level high
      - run: bun run check
      - run: bun run build
      - name: Pack and publish
        run: |
          set -euo pipefail
          tarball="$(npm pack | tail -n 1)"
          npm publish "$tarball" --access public
